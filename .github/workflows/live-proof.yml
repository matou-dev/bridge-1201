# Manual live proof (D3): full Forge 1.20.1 (1.20.1-47.2.0) server run + world==union.
#
# tools/run-live.sh is wired (pins, Mojmap→SRG derive, run.sh boot, palette
# verdict). Green runs on github-hosted runners need network once to
# provision the D3_DIR cache (installer + mappings); set offline=true to
# reuse cache, never download. The reference path stays local (bridge
# README) or the pinned live image (tools/live/Dockerfile).
# Last green proof: hub STATE.md.
#
# Actions pinned by SHA 2026-09-09 (tags v4); Dependabot keeps them fresh.
name: live-proof
on:
  workflow_dispatch:
    inputs:
      boot_secs:
        description: "Server run time (short runs fail coverage loudly)"
        default: "150"
      offline:
        description: "Reuse cache, never download"
        type: boolean
        default: false
jobs:
  live:
    runs-on: ubuntu-24.04
    steps:
      # Sibling layout (cf. hub README): run-live.sh proves against
      # ../spi, ../example1 and ../minimap checkouts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: bridge-1201
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: matou-dev/spi
          path: spi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: matou-dev/example1
          path: example1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: matou-dev/minimap
          path: minimap
      # Live path needs a real JDK 17 (javac --release 8 + server runtime),
      # not the default runner JDK tools/check.sh stage 1 tolerates.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          export JAVA17_HOME="$JAVA_HOME"
          export BOOT_SECS="${{ inputs.boot_secs }}"
          if [ "${{ inputs.offline }}" = "true" ]; then export D3_OFFLINE=1; fi
          sh bridge-1201/tools/run-live.sh
