# D3 autoplay dev-only mod metadata: stamped by hub tools/run-client.sh
# (@VERSION@ token, same practice as forge/src/META-INF/mods.toml). Ships
# only in the DEV companion jar (matouautoplay.jar, never in dist/).
modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
[[mods]]
modId="matouautoplay"
version="@VERSION@"
displayName="MatouAutoplay"
description="DEV-ONLY scripted client driver for the matou proof (tick-count, quit; quick-play joins). Never ships."
[[dependencies.matouautoplay]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"
# Custom entity tranche (hub decisions/SPAWN.md): the companion
# frame-references the bridge's MatouEntity (new/instanceof), so it
# loads AFTER the bridge jar is sourced — the 1.20.1 shape of the lead
# bridge's required-after:matoubridge (measured there: alpha-order
# construction + verifier eager loading + negative cache = CNFE without
# it). Load-bearing: removing it re-arms the crash. Unproven on 47.2.0
# until the live tranche (kept by construction: the bridge is always
# present in our runs).
[[dependencies.matouautoplay]]
modId="matoubridge"
mandatory=true
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
